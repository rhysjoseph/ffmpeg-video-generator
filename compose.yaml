name: pattern-studio
services:
  studio:
    build: .
    init: true
    ports:
      - "127.0.0.1:9191:9191"
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:9191/health',timeout=3))['ready']"]
      interval: 30s
      start_period: 10s
      timeout: 5s
      retries: 3
volumes:
  uploads:
  outputs:
